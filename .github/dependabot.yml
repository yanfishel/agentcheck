# Weekly dependency updates as pull requests, which the CI gate checks like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for all action updates, so they do not queue up
      # behind each other on the CI gate.
      actions:
        patterns: ["*"]
