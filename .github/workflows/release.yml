# A `vX.Y.Z` tag runs the commit gate, then publishes the service images as
# `:vX.Y.Z` and the `agentcheck` CLI to npm. A manual run publishes images
# tagged `:sha-<short>` for a trial deploy and does not touch npm.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Tag matches the package versions
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

  gate:
    uses: ./.github/workflows/ci.yml

  images:
    needs: [version, gate]
    # A manual run skips `version`; a failed one still stops the release.
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.version.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yanfishel/agentcheck-web:${{ steps.tag.outputs.value }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: worker
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yanfishel/agentcheck-worker:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  npm:
    name: Publish the CLI to npm
    if: github.ref_type == 'tag'
    needs: [version, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and the provenance attestation
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older one.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter agentcheck build
      - run: pnpm --filter agentcheck publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"
