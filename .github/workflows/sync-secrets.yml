# Moves the Clerk keys from repository secrets into the server's .env.
# The deploy key's forced command (deploy/bin/ci) runs set-env for this.
name: Sync server secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Send the secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -eu
          # Every value is checked before anything is sent: a missing one fails
          # the run here, in the log, and set-env never hears from us.
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST CLERK_SECRET_KEY CLERK_WEBHOOK_SIGNING_SECRET NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY; do
            if [ -z "$(printenv "$name" || true)" ]; then
              echo "::error::$name is not set (repository secret or variable)"
              exit 1
            fi
          done
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          for name in CLERK_SECRET_KEY CLERK_WEBHOOK_SIGNING_SECRET NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY; do
            printf '%s=%s\n' "$name" "$(printenv "$name")"
          done | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST" set-env
