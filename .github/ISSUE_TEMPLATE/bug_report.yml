name: Bug report
description: Something in the CLI, the engine or agentcheck.dev does not work as expected.
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: CLI (with version from `npx agentcheck -v`) or agentcheck.dev.
      placeholder: agentcheck 0.x.y, or agentcheck.dev
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Audited URL
      description: The public page you checked, if you can share it.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For a wrong check result, say which check and why you think it is wrong.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The terminal output or the relevant part of `--format=json`.
      render: text
